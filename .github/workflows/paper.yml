name: Publish local simulation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['live/**', '.github/workflows/paper.yml']
concurrency:
  group: paper-pages
  cancel-in-progress: false
permissions:
  pages: write
  id-token: write
  contents: read
jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: live
      - id: publish
        uses: actions/deploy-pages@v4
