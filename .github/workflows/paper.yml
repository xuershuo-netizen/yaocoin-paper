name: Paper trading and Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paper.yml'
  schedule:
    - cron: '4-59/5 * * * *'
concurrency:
  group: paper-pages
  cancel-in-progress: false
permissions: {}
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python github_tick.py
      - name: Save simulation state
        shell: bash
        run: |
          if test -f paper-state.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add paper-state.json
            if ! git diff --cached --quiet; then
              git commit -m 'Save paper trading state'
              git push
            fi
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  pages:
    needs: snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v4
